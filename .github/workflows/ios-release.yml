name: iOS Release (TestFlight)

on:
  workflow_dispatch:        # TestFlight'a imzalı yükleme — elle tetiklenir

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: App Store Connect API key dosyasını hazırla (secret'tan)
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Dağıtım sertifikasını geçici keychain'e aktar (secret'tan)
        env:
          KEYCHAIN_PASSWORD: ci-temp-pass-2026
        run: |
          echo "${{ secrets.APPLE_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ios_dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/ios_dist.p12" -k build.keychain -P sayiliavm2026 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

      - name: App Store provisioning profilini indir ve kur
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          python3 - <<'PYEOF'
          import time, json, base64, urllib.request
          import jwt
          import os

          key_id = os.environ["APPLE_API_KEY_ID"]
          issuer_id = os.environ["APPLE_API_ISSUER_ID"]
          with open(os.path.expanduser("~/private_keys/AuthKey_" + key_id + ".p8")) as f:
              private_key = f.read()

          token = jwt.encode(
              {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256", headers={"kid": key_id},
          )
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles/XLX934ZY3Q",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(req) as r:
              resp = json.loads(r.read().decode())
          attrs = resp["data"]["attributes"]
          out_path = os.path.expanduser(
              "~/Library/MobileDevice/Provisioning Profiles/" + attrs["uuid"] + ".mobileprovision"
          )
          with open(out_path, "wb") as f:
              f.write(base64.b64decode(attrs["profileContent"]))
          print("installed profile:", attrs["name"], attrs["uuid"])
          PYEOF
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Archive (manuel imzalama, App Store profiliyle)
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.0

      - name: TestFlight'a yükle (export + upload tek adımda)
        working-directory: ios/App
        env:
          AUTH_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ../exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER_ID }}"
